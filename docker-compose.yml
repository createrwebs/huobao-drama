services:
  app:
    container_name: huobao-drama
    image: huobao-drama:storyvdo
    build:
      context: .
      args:
        HUOBAO_VERSION: 4.0.8
    ports:
      - "127.0.0.1:5679:5679"
    environment:
      - NODE_ENV=production
      - PORT=5679
      - PUBLIC_BASE_URL=https://www.toraapi.com/storyvdo
    volumes:
      - ./data:/app/data
    restart: unless-stopped
