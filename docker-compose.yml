services:
  app:
    container_name: huobao-drama
    image: huobao-drama:storyvdo
    build:
      context: .
      args:
        HUOBAO_VERSION: 4.0.8
    ports:
      - "127.0.0.1:5679:5679"
    environment:
      - NODE_ENV=production
      - PORT=5679
      - PUBLIC_BASE_URL=https://www.toraapi.com/storyvdo
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  api:
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/drama # ⚠️ IMPORTANT: Change the password in production!
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: drama
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

volumes:
  pg_data:
#  mysql_data:
#  clickhouse_data:

networks:
  new-api-network:
    driver: bridge
